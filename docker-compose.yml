---
# Local development and single-host use. The cluster deployment lives in
# x-real-ip/gitops (manifests/overload/); see deploy/README.md.
services:
  overload:
    build: .
    image: overload:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # The db service below refuses to start without POSTGRES_PASSWORD.
      DATABASE_URL: "postgres://${POSTGRES_USER:-overload}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-overload}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-overload}
    ports:
      # Exposed on localhost so `npm run dev` and `npm run migrate` on the host can use it.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
