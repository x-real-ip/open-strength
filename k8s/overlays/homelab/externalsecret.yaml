# Secrets from Vault (KV v2) through External Secrets Operator.
# Expected Vault keys at homelab/overload (CHANGE-ME path/store):
#   postgres_user, postgres_password, postgres_db,
#   session_secret, ai_api_key, oidc_client_secret (may be empty until Authentik is set up)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overload-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend # CHANGE-ME
  target:
    name: overload-db
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: homelab/overload
        property: postgres_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: homelab/overload
        property: postgres_password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: homelab/overload
        property: postgres_db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overload-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend # CHANGE-ME
  target:
    name: overload-secrets
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: homelab/overload
        property: session_secret
    - secretKey: AI_API_KEY
      remoteRef:
        key: homelab/overload
        property: ai_api_key
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: homelab/overload
        property: oidc_client_secret
