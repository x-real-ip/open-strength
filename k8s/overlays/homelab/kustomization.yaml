apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Homelab overlay: Gateway API (NGINX Gateway Fabric), secrets from Vault via
# External Secrets Operator, and Authentik-ready settings. Adjust the values
# marked CHANGE-ME.

resources:
  - ../../base
  - httproute.yaml
  - externalsecret.yaml
  - networkpolicy-app.yaml

images:
  - name: overload
    newName: ghcr.io/CHANGE-ME/overload
    newTag: "1.1.0"

patches:
  - path: config-patch.yaml
