# Only the gateway may reach the app. If you later put an Authentik proxy outpost
# in front (AUTH_MODE=proxy), this policy is what stops anyone from bypassing it
# and sending their own X-authentik-* headers: allow only the outpost then.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: overload-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: overload
      app.kubernetes.io/component: app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway # CHANGE-ME: gateway namespace
      ports:
        - protocol: TCP
          port: 8080
