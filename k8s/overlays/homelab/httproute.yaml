# TLS terminates at the Gateway listener (certificate via cert-manager on the Gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overload
  labels:
    app.kubernetes.io/name: overload
spec:
  parentRefs:
    - name: gateway # CHANGE-ME: your Gateway
      namespace: nginx-gateway # CHANGE-ME
      sectionName: https # CHANGE-ME: the HTTPS listener
  hostnames:
    - fitness.lan.stamx.nl # CHANGE-ME
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: overload
          port: 80
