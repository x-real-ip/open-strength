apiVersion: v1
kind: Service
metadata:
  name: overload-postgres
  labels:
    app.kubernetes.io/name: overload
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: overload
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: overload-postgres-headless
  labels:
    app.kubernetes.io/name: overload
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: overload
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
