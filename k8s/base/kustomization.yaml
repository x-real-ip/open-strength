apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: overload

labels:
  - pairs:
      app.kubernetes.io/part-of: overload
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - postgres-backup.yaml
  - networkpolicy-postgres.yaml

images:
  - name: overload
    newName: ghcr.io/CHANGE-ME/overload
    newTag: "1.1.0"
