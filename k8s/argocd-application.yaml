# Example ArgoCD Application for the homelab overlay. Push this repository to your
# Git server first and adjust repoURL/targetRevision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overload
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.com/coen/overload.git # CHANGE-ME
    targetRevision: main
    path: k8s/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: overload
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
