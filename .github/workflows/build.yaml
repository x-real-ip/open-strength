name: Build & push image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/x-real-ip/open-strength

jobs:
  # Typecheck, tests and the PWA build first. If this fails, no image is built.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix web ci

      - name: Typecheck
        run: npm run typecheck

      # The tests start a throwaway embedded Postgres per test file.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Migrations run against a real Postgres 18, twice (the second run must be a
  # no-op), and the app is started to check that /healthz sees the database.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: open_strength
          POSTGRES_PASSWORD: open_strength
          POSTGRES_DB: open_strength
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_strength"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://open_strength:open_strength@localhost:5432/open_strength
      PORT: 8080
      MIGRATE_ON_START: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Migrate
        run: npm run migrate

      - name: Migrate again (must be a no-op)
        run: npm run migrate | tee /tmp/migrate.log && grep -q "up to date" /tmp/migrate.log

      - name: Start the app and check /healthz
        run: |
          node --disable-warning=ExperimentalWarning server/index.ts &
          app_pid=$!
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          kill "$app_pid" || true
          cat /tmp/healthz.json
          grep -q '"database":"ok"' /tmp/healthz.json

  # The main flow in a real browser: profile, program, workout and summary, in English and
  # Dutch, on a phone and a desktop viewport (e2e/). The app runs from source against Postgres.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: open_strength
          POSTGRES_PASSWORD: open_strength
          POSTGRES_DB: open_strength
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_strength"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgres://open_strength:open_strength@localhost:5432/open_strength

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix web ci

      - name: Build the PWA
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs:
      - check
      - migrations
      - e2e

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Branch tag (not for main)
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

            # PR tags
            type=ref,event=pr

            # Git release tags
            type=semver,pattern={{version}}

            # Immutable tag
            type=sha,format=short

            # Only main gets latest
            type=raw,value=latest,enable={{is_default_branch}}

      # The release tag is the version (v1.2.3 → 1.2.3); other builds show dev-<commit>.
      - name: App version
        id: appversion
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.appversion.outputs.version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A published release (tag v1.2.3 → image 1.2.3) goes straight to the
  # cluster: the gitops repo pins the image to the new version and Argo CD
  # syncs it. Branch and PR builds don't deploy.
  deploy-release:
    name: Deploy release via gitops
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Image tag from release tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: x-real-ip/gitops
          event-type: update-manifest
          client-payload: >-
            {"ref": "${{ github.ref }}",
            "repository": "${{ github.repository }}",
            "registry": "${{ env.REGISTRY }}",
            "sha": "${{ github.sha }}",
            "tag": "${{ steps.version.outputs.tag }}",
            "images": "${{ env.IMAGE }}"}
