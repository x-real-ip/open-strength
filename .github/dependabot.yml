---
# Weekly dependency updates. The node base image is watched by the "Check releases"
# workflow (new-release-monitor.yaml), so Docker is left out here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [chore, dependencies]
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates together in one PR; majors each get their own.
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    labels: [chore, dependencies]
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [chore, dependencies]
    groups:
      actions:
        patterns: ["*"]
